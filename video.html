<!DOCTYPE html>
<html lang="zh" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>视频 — 谷建霏 · AI 影像作品集</title>
<style>
  :root{
    --ink:#23252b; --sub:#8a8f99; --line:rgba(40,44,52,.16); --soft:#5c6169;
    --lav:#b79bf0; --cyan:#8fd0d2; --warm:#ffdca8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); background:#eef0f3; overflow-x:clip; -webkit-font-smoothing:antialiased;}

  /* ============ 返回GROUND ============ */
  .bg{position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(120% 110% at 14% 10%, rgba(183,155,240,.30), transparent 56%),
      radial-gradient(120% 110% at 88% 88%, rgba(143,208,210,.26), transparent 56%),
      radial-gradient(90% 90% at 62% 52%, rgba(255,233,200,.24), transparent 62%),
      linear-gradient(165deg,#f5f5f7 0%,#e9ebef 48%,#f1f3f5 100%);}
  .glow{position:absolute; will-change:transform;}
  .g1{left:-9vmax;top:-11vmax;animation:driftA 26s ease-in-out infinite;}
  .g2{right:-11vmax;bottom:-13vmax;animation:driftB 32s ease-in-out infinite;}
  .g3{left:56%;top:58%;animation:driftC 29s ease-in-out infinite;}
  @keyframes driftA{0%,100%{transform:translate(0,0);}50%{transform:translate(5vmax,4vmax);}}
  @keyframes driftB{0%,100%{transform:translate(0,0);}50%{transform:translate(-5vmax,-4vmax);}}
  @keyframes driftC{0%,100%{transform:translate(0,0);}50%{transform:translate(-4vmax,3vmax);}}
  .blob{border-radius:50%; filter:blur(70px); opacity:.46; mix-blend-mode:soft-light;
    will-change:transform; transition:transform 1.6s cubic-bezier(.16,.84,.32,1);}
  .b1{width:44vmax;height:44vmax;background:var(--lav);}
  .b2{width:38vmax;height:38vmax;background:var(--cyan);}
  .b3{width:28vmax;height:28vmax;background:var(--warm);}
  .cursorlight{position:fixed; width:520px; height:520px; left:0; top:0; margin:-260px 0 0 -260px;
    border-radius:50%; pointer-events:none; z-index:1; opacity:0;
    background:radial-gradient(circle, rgba(255,255,255,.5), rgba(255,244,225,.2) 45%, transparent 70%);
    filter:blur(28px); transition:opacity .8s ease; will-change:transform;}

  /* ============ HEADER ============ */
  header{position:fixed; top:0; left:0; right:0; z-index:40; display:flex; justify-content:space-between;
    align-items:flex-start; padding:clamp(18px,3vw,38px) clamp(22px,4vw,56px);}
  .brand .cn{display:block; font-size:clamp(15px,1.4vw,19px); font-weight:700; letter-spacing:.06em;}
  .brand .en{display:block; margin-top:4px; font-size:clamp(11px,1vw,13px); font-weight:500; letter-spacing:.28em; color:#5c6169;}
  .brand .role{display:block; margin-top:5px; font-size:clamp(9px,.78vw,10.5px); letter-spacing:.34em; color:var(--sub);}
  nav{display:flex; gap:clamp(18px,2.4vw,38px); padding-top:5px;}
  nav a{position:relative; font-size:clamp(11px,.95vw,13px); letter-spacing:.26em; font-weight:400;
    color:var(--ink); text-decoration:none; padding-bottom:6px;}
  nav a::after{content:""; position:absolute; left:0; bottom:0; width:100%; height:1px; background:var(--ink);
    transform:scaleX(0); transform-origin:left; transition:transform .5s cubic-bezier(.16,.84,.32,1);}
  nav a:hover::after{transform:scaleX(1);}
  nav a.active::after{transform:scaleX(1); opacity:.42;}

  .wrap{max-width:1180px; margin:0 auto; padding:0 clamp(22px,4vw,56px); position:relative; z-index:2;}

  /* ============ HERO ============ */
  .hero{padding:clamp(150px,21vh,210px) 0 clamp(26px,4vh,52px);}
  .hero h1{font-size:clamp(56px,11vw,160px); font-weight:800; letter-spacing:-.03em; line-height:.92;}
  .hero .sub{margin-top:clamp(14px,2.2vh,24px); font-size:clamp(10.5px,.95vw,13px);
    letter-spacing:.34em; color:#5c6169; line-height:2;}

  /* ============ 分类导航（玻璃标签栏） ============ */
  .catnav{margin:clamp(8px,1.6vh,18px) 0 clamp(28px,5vh,56px);
    padding:clamp(12px,1.4vw,18px); border-radius:22px;
    background:rgba(255,255,255,0.52); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.62);
    box-shadow:0 18px 44px -34px rgba(40,44,52,0.5), inset 0 1px 0 rgba(255,255,255,0.6);}
  .catgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:clamp(10px,1.2vw,18px);}
  .cat{position:relative; text-decoration:none; color:inherit; cursor:pointer;
    display:flex; flex-direction:column; gap:7px; padding:clamp(13px,1.5vw,19px);
    border-radius:16px; background:rgba(255,255,255,0.42);
    border:1px solid rgba(255,255,255,0.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.6);
    transition:transform .5s cubic-bezier(.16,.84,.32,1), box-shadow .5s ease, background .4s ease, border-color .4s ease;
    opacity:0; transform:translateY(22px);}
  .cat.in{opacity:1; transform:none;}
  .cat:hover{transform:translateY(-6px); box-shadow:0 34px 60px -34px rgba(40,44,52,0.55);
    background:rgba(255,255,255,0.64); border-color:rgba(40,44,52,0.14);}
  .cat.active{background:rgba(255,255,255,0.78); border-color:rgba(183,155,240,0.55);
    box-shadow:0 26px 50px -34px rgba(40,44,52,0.5), 0 0 0 1px rgba(183,155,240,0.28);}
  .cat .carr{position:absolute; top:clamp(11px,1.3vw,17px); right:clamp(11px,1.3vw,17px);
    font-size:11px; color:var(--lav); opacity:0; transform:translateY(-3px); transition:opacity .4s ease, transform .4s ease;}
  .cat:hover .carr,.cat.active .carr{opacity:1; transform:none;}
  .cat .cno{font-size:clamp(10px,.85vw,12px); letter-spacing:.3em; color:var(--sub);}
  .cat .cnm{font-size:clamp(15px,1.5vw,21px); font-weight:700; letter-spacing:.02em;}
  .cat .ccnt{font-size:clamp(9px,.8vw,11px); letter-spacing:.22em; color:var(--sub);}

  /* ============ SECTION HEAD ============ */
  .sec-head{display:flex; align-items:baseline; gap:18px; margin-bottom:clamp(20px,3vh,38px);}
  .sec-head .snum{font-size:clamp(30px,4.4vw,62px); font-weight:800; letter-spacing:-.02em; line-height:1;}
  .sec-head .stxt{display:flex; flex-direction:column; gap:7px;}
  .sec-head .snm{font-size:clamp(20px,2vw,30px); font-weight:700; letter-spacing:.02em;}
  .sec-head .sen{font-size:clamp(9.5px,.85vw,12px); letter-spacing:.28em; color:var(--sub);}
  .sec-head .scnt{margin-left:auto; font-size:clamp(10px,.85vw,12px); letter-spacing:.22em; color:var(--sub);}

  /* ============ TAB PANE (switch fade + slight up) ============ */
  .wpane{opacity:0; transform:translateY(16px); padding:clamp(8px,1.5vh,18px) 0;
    transition:opacity .5s ease, transform .6s cubic-bezier(.16,.84,.32,1);}
  .wpane.show{opacity:1; transform:none;}
  .wpane.leaving{opacity:0; transform:translateY(-12px); transition:opacity .28s ease, transform .28s ease;}

  /* ============ VIDEO GRID ============ */
  .vgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(18px,2.4vw,40px);}
  .vcard{display:block; text-decoration:none; color:inherit; border-radius:18px; overflow:hidden;
    background:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.55);
    box-shadow:0 18px 40px -34px rgba(40,44,52,0.5), inset 0 1px 0 rgba(255,255,255,0.6);
    transition:transform .55s cubic-bezier(.16,.84,.32,1), box-shadow .55s ease;}
  .vcard:hover{transform:translateY(-6px);
    box-shadow:0 42px 72px -34px rgba(40,44,52,0.6), inset 0 1px 0 rgba(255,255,255,0.85);}
  .vthumb{position:relative; aspect-ratio:16/9; overflow:hidden; background:#e7e9ec;}
  .vimg{position:absolute; inset:0; background-size:cover; background-position:center; transform:scale(1.0);
    transition:transform .9s cubic-bezier(.16,.84,.32,1);}
  .vcard:hover .vimg{transform:scale(1.06);}
  .vplay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0;
    transition:opacity .5s ease; background:linear-gradient(180deg, rgba(40,44,52,0.04), rgba(40,44,52,0.28));}
  .vcard:hover .vplay{opacity:1;}
  .vplay i{width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,0.92);
    box-shadow:0 10px 30px -10px rgba(40,44,52,0.5); display:flex; align-items:center; justify-content:center;
    transform:scale(0.82); transition:transform .5s cubic-bezier(.16,.84,.32,1);}
  .vcard:hover .vplay i{transform:scale(1);}
  .vplay i::after{content:''; display:block; width:0; height:0; margin-left:4px;
    border-left:15px solid #23252b; border-top:9px solid transparent; border-bottom:9px solid transparent;}
  .vmeta{padding:clamp(13px,1.5vw,19px) clamp(14px,1.6vw,20px) clamp(15px,1.7vw,21px);}
  .vname{font-size:clamp(15px,1.4vw,19px); font-weight:700; letter-spacing:.02em;}
  .vrow{display:flex; justify-content:space-between; margin-top:9px; font-size:clamp(10px,.85vw,12px);
    letter-spacing:.16em; color:var(--sub);}

  /* ============ PAGE NAV (back to top + back home) ============ */
  .pagenav{display:flex; justify-content:space-between; align-items:center; gap:18px; flex-wrap:wrap;
    padding:clamp(40px,7vh,90px) 0 clamp(18px,4vh,46px); border-top:1px solid var(--line);
    margin-top:clamp(30px,6vh,70px);}
  .pn-back{font-size:clamp(10px,.9vw,12px); letter-spacing:.26em; color:var(--sub); text-decoration:none;
    transition:color .4s ease, transform .5s cubic-bezier(.16,.84,.32,1);}
  .pn-back:hover{color:var(--ink); transform:translateX(-4px);}
  .pn-back.r:hover{transform:translateX(4px);}

  footer{padding:clamp(28px,5vh,56px) 0 clamp(34px,6vh,70px); display:flex; justify-content:space-between;
    align-items:center; flex-wrap:wrap; gap:14px; color:var(--sub); font-size:11px; letter-spacing:.22em;}
  footer a{color:var(--sub); text-decoration:none;} footer a:hover{color:var(--ink);}

  /* ============ ANIMATION ============ */
  .fade{opacity:0; transition:opacity 1.15s ease;}
  .up{opacity:0; transform:translateY(28px); transition:opacity 1.05s ease, transform 1.05s cubic-bezier(.16,.84,.32,1);}
  .ready .fade{opacity:1;} .ready .up{opacity:1; transform:none;}
  .d1{transition-delay:.06s;} .d2{transition-delay:.12s;} .d3{transition-delay:.18s;} .d4{transition-delay:.24s;}
  .reveal{opacity:0; transform:translateY(36px);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.16,.84,.32,1);}
  .reveal.in{opacity:1; transform:none;}

  @media (max-width:1000px){ .vgrid{grid-template-columns:repeat(2,1fr);} .catgrid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:760px){
    .hero{padding-top:clamp(120px,16vh,150px);}
    .catgrid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:640px){ .vgrid{grid-template-columns:1fr;} }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;}
    html{scroll-behavior:auto;}
    .fade,.up,.reveal,.wpane{transition:opacity .4s ease !important; transform:none !important;}
  }
</style>
</head>
<body id="top">
  <div class="bg" aria-hidden="true">
    <div class="glow g1"><div class="blob b1"></div></div>
    <div class="glow g2"><div class="blob b2"></div></div>
    <div class="glow g3"><div class="blob b3"></div></div>
  </div>
  <div class="cursorlight" id="clight" aria-hidden="true"></div>

  <header>
    <div class="brand fade">
      <span class="cn">谷建霏</span>
      <span class="en">AIGC 视觉设计师</span>
      <span class="role">个人作品集</span>
    </div>
    <nav class="fade">
      <a href="index.html">首页</a>
      <a href="about.html">关于</a>
      <a href="design.html">设计</a>
      <a href="video.html" class="active">视频</a>
      <a href="app.html">应用</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero" id="top-hero">
      <h1 class="up">视频</h1>
      <div class="sub up d1">AI 短片 · 动态影像 · 视觉叙事 — 视频作品集</div>
    </section>

    <nav class="catnav" id="catnav" aria-label="视频分类导航">
      <div class="catgrid" id="catGrid"></div>
    </nav>

    <div id="works"></div>

    <nav class="pagenav">
      <a class="pn-back" href="#top-hero">&uarr; 回到顶部</a>
      <a class="pn-back r" href="index.html">&larr; 返回首页</a>
    </nav>

    <footer>
      <span>© 2026 谷建霏</span>
      <span><a href="mailto:19831553856@163.com">19831553856@163.com</a></span>
      <span>视频作品集</span>
    </footer>
  </main>

  <script src="data.js"></script>
  <script>
  (function(){
    var PF = window.PF;
    if(!PF || !PF.videos) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var grid = document.getElementById('catGrid');
    var works = document.getElementById('works');
    var current = null;
    var switchTimer = null;

    /* ---- category nav cards (Tab headers) ---- */
    PF.videoCats.forEach(function(cat, i){
      var el = document.createElement('a');
      el.className = 'cat up d' + ((i % 4) + 1);
      el.href = 'javascript:void(0)';
      el.dataset.cat = cat.id;
      el.setAttribute('role', 'tab');
      el.innerHTML =
        '<span class="carr">&darr;</span>' +
        '<span class="cno">' + cat.num + '</span>' +
        '<span class="cnm">' + cat.name + '</span>' +
        '<span class="ccnt">' + cat.count + ' 部作品</span>';
      el.addEventListener('click', function(e){
        e.preventDefault();
        showCat(cat.id);
      });
      grid.appendChild(el);
    });

    /* ---- build one category pane (header + video grid) ---- */
    function renderCat(catId){
      var cat = PF.findVideoCat(catId) || PF.videoCats[0];
      var items = PF.videos.filter(function(v){ return v.cat === cat.id; });
      var pane = document.createElement('section');
      pane.className = 'wpane';
      pane.setAttribute('role', 'tabpanel');
      pane.innerHTML =
        '<div class="sec-head">' +
          '<span class="snum">' + cat.num + '</span>' +
          '<span class="stxt"><span class="snm">' + cat.name + '</span>' +
          '<span class="sen">' + cat.en + ' · AI 短片</span></span>' +
          '<span class="scnt">' + items.length + ' 部作品</span>' +
        '</div>' +
        '<div class="vgrid"></div>';
      var vg = pane.querySelector('.vgrid');
      items.forEach(function(v){
        var a = document.createElement('a');
        a.className = 'vcard';
        a.href = 'video-detail.html?v=' + v.id;
        var coverUrl = v.image ? v.image : PF.video(v.seed, v.pal);
        a.innerHTML =
          '<div class="vthumb"><div class="vimg" style="background-image:url(\'' + coverUrl + '\')"></div>' +
            '<div class="vplay"><i></i></div></div>' +
          '<div class="vmeta"><div class="vname">' + v.title + '</div>' +
            '<div class="vrow"><span>' + v.year + '</span><span>' + v.type + '</span></div></div>';
        vg.appendChild(a);
      });
      return pane;
    }

    /* ---- Tab switch: smooth fade + slight upward move, no page jump ---- */
    function showCat(catId){
      if(catId === current) return;
      if(switchTimer){ clearTimeout(switchTimer); switchTimer = null; }
      // highlight active tab
      document.querySelectorAll('.cat').forEach(function(c){
        c.classList.toggle('active', c.dataset.cat === catId);
      });
      var old = works.querySelector('.wpane');
      var newPane = renderCat(catId);
      if(old && !reduce){
        old.classList.remove('show');
        old.classList.add('leaving');
        switchTimer = setTimeout(function(){
          if(old.parentNode) old.parentNode.removeChild(old);
          works.appendChild(newPane);
          requestAnimationFrame(function(){ requestAnimationFrame(function(){ newPane.classList.add('show'); }); });
        }, 280);
      } else {
        if(old && old.parentNode) old.parentNode.removeChild(old);
        works.appendChild(newPane);
        requestAnimationFrame(function(){ requestAnimationFrame(function(){ newPane.classList.add('show'); }); });
      }
      current = catId;
    }

    /* ---- init: default shows first category (TVC广告) ---- */
    showCat(PF.videoCats[0].id);

    /* ---- entrance reveal ---- */
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ document.body.classList.add('ready'); });
    });
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold:0.12 });
    document.querySelectorAll('.cat, .reveal').forEach(function(el){ io.observe(el); });

    /* ---- cursor light + parallax blobs (same as other pages) ---- */
    if(!reduce){
      var blobs = [document.querySelector('.b1'), document.querySelector('.b2'), document.querySelector('.b3')];
      var clight = document.getElementById('clight');
      var lx = window.innerWidth / 2, ly = window.innerHeight / 2, ticking = false;
      clight.style.transform = 'translate(' + lx + 'px,' + ly + 'px)';
      window._cx = lx; window._cy = ly;
      function follow(){
        lx += (window._cx - lx) * 0.09; ly += (window._cy - ly) * 0.09;
        clight.style.transform = 'translate(' + lx + 'px,' + ly + 'px)';
        ticking = false;
      }
      window.addEventListener('mousemove', function(e){
        var mx = e.clientX / window.innerWidth - 0.5, my = e.clientY / window.innerHeight - 0.5;
        window._cx = e.clientX; window._cy = e.clientY;
        clight.style.opacity = '1';
        if(blobs[0]) blobs[0].style.transform = 'translate(' + (mx * 28) + 'px,' + (my * 24) + 'px)';
        if(blobs[1]) blobs[1].style.transform = 'translate(' + (mx * -24) + 'px,' + (my * -20) + 'px)';
        if(blobs[2]) blobs[2].style.transform = 'translate(' + (mx * 15) + 'px,' + (my * -28) + 'px)';
        if(!ticking){ ticking = true; requestAnimationFrame(follow); }
      });
      window.addEventListener('mouseleave', function(){ clight.style.opacity = '0'; });
    }
  })();
  </script>

  <script src="transition.js"></script>
</body>
</html>
