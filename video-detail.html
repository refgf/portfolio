<!DOCTYPE html>
<html lang="zh" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>视频详情 — 谷建霏</title>
<style>
  :root{
    --ink:#23252b; --sub:#8a8f99; --line:rgba(40,44,52,.16); --soft:#5c6169;
    --lav:#b79bf0; --cyan:#8fd0d2; --warm:#ffdca8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); background:#eef0f3; overflow-x:hidden; -webkit-font-smoothing:antialiased;}

  .bg{position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(120% 110% at 14% 10%, rgba(183,155,240,.30), transparent 56%),
      radial-gradient(120% 110% at 88% 88%, rgba(143,208,210,.26), transparent 56%),
      radial-gradient(90% 90% at 62% 52%, rgba(255,233,200,.24), transparent 62%),
      linear-gradient(165deg,#f5f5f7 0%,#e9ebef 48%,#f1f3f5 100%);}
  .glow{position:absolute; will-change:transform;}
  .g1{left:-9vmax;top:-11vmax;animation:driftA 26s ease-in-out infinite;}
  .g2{right:-11vmax;bottom:-13vmax;animation:driftB 32s ease-in-out infinite;}
  .g3{left:56%;top:58%;animation:driftC 29s ease-in-out infinite;}
  @keyframes driftA{0%,100%{transform:translate(0,0);}50%{transform:translate(5vmax,4vmax);}}
  @keyframes driftB{0%,100%{transform:translate(0,0);}50%{transform:translate(-5vmax,-4vmax);}}
  @keyframes driftC{0%,100%{transform:translate(0,0);}50%{transform:translate(-4vmax,3vmax);}}
  .blob{border-radius:50%; filter:blur(70px); opacity:.46; mix-blend-mode:soft-light;
    will-change:transform; transition:transform 1.6s cubic-bezier(.16,.84,.32,1);}
  .b1{width:44vmax;height:44vmax;background:var(--lav);}
  .b2{width:38vmax;height:38vmax;background:var(--cyan);}
  .b3{width:28vmax;height:28vmax;background:var(--warm);}
  .cursorlight{position:fixed; width:520px; height:520px; left:0; top:0; margin:-260px 0 0 -260px;
    border-radius:50%; pointer-events:none; z-index:1; opacity:0;
    background:radial-gradient(circle, rgba(255,255,255,.5), rgba(255,244,225,.2) 45%, transparent 70%);
    filter:blur(28px); transition:opacity .8s ease; will-change:transform;}

  header{position:fixed; top:0; left:0; right:0; z-index:30; display:flex; justify-content:space-between;
    align-items:flex-start; padding:clamp(20px,3.2vw,42px) clamp(22px,4vw,56px);}
  .brand .cn{display:block; font-size:clamp(15px,1.4vw,19px); font-weight:700; letter-spacing:.06em;}
  .brand .en{display:block; margin-top:4px; font-size:clamp(11px,1vw,13px); font-weight:500; letter-spacing:.28em; color:#5c6169;}
  .brand .role{display:block; margin-top:5px; font-size:clamp(9px,.78vw,10.5px); letter-spacing:.34em; color:var(--sub);}
  nav{display:flex; gap:clamp(18px,2.4vw,38px); padding-top:5px;}
  nav a{position:relative; font-size:clamp(11px,.95vw,13px); letter-spacing:.26em; font-weight:400;
    color:var(--ink); text-decoration:none; padding-bottom:6px;}
  nav a::after{content:""; position:absolute; left:0; bottom:0; width:100%; height:1px; background:var(--ink);
    transform:scaleX(0); transform-origin:left; transition:transform .5s cubic-bezier(.16,.84,.32,1);}
  nav a:hover::after{transform:scaleX(1);}
  nav a.active::after{transform:scaleX(1); opacity:.42;}

  .wrap{max-width:1040px; margin:0 auto; padding:0 clamp(22px,4vw,56px); position:relative; z-index:2;}

  .back{display:inline-block; margin:clamp(140px,19vh,200px) 0 clamp(6px,1.4vh,14px); font-size:clamp(10px,.9vw,12px);
    letter-spacing:.26em; color:var(--sub); text-decoration:none;
    transition:color .4s ease, transform .5s cubic-bezier(.16,.84,.32,1);}
  .back:hover{color:var(--ink); transform:translateX(-4px);}

  .detail{padding:clamp(8px,2vh,24px) 0 clamp(20px,4vh,48px);}
  .dcat{font-size:clamp(10px,.9vw,12px); letter-spacing:.3em; color:var(--sub);}
  .dtitle{margin-top:clamp(10px,1.6vh,18px); font-size:clamp(34px,6vw,84px); font-weight:800; letter-spacing:-.02em; line-height:1;}
  .dmeta{display:flex; gap:20px; margin-top:clamp(12px,1.8vh,22px); font-size:clamp(10px,.9vw,12px);
    letter-spacing:.24em; color:var(--sub);}
  .dmeta span{position:relative; padding-right:20px;}
  .dmeta span+span::before{content:""; position:absolute; left:-10px; top:50%; width:3px; height:3px; border-radius:50%;
    background:var(--sub); transform:translateY(-50%);}
  .ddesc{margin-top:clamp(14px,2vh,24px); max-width:62ch; font-size:clamp(12px,1vw,14px); line-height:1.85; color:var(--soft);}

  .dframe{position:relative; aspect-ratio:16/9; border-radius:22px; overflow:hidden; margin-top:clamp(22px,3.4vh,44px);
    background-size:cover; background-position:center;
    box-shadow:0 30px 70px -40px rgba(40,44,52,0.6), inset 0 1px 0 rgba(255,255,255,0.6);
    border:1px solid rgba(255,255,255,0.55);}
  .dimg{position:absolute; inset:0; background-size:cover; background-position:center; transform:scale(1.0);
    transition:transform 1.1s cubic-bezier(.16,.84,.32,1);}
  .dframe:hover .dimg{transform:scale(1.04);}
  .dplay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(40,44,52,0.04), rgba(40,44,52,0.26)); transition:opacity .5s ease; opacity:0;}
  .dframe:hover .dplay{opacity:1;}
  .dplay i{width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,0.92);
    box-shadow:0 12px 34px -10px rgba(40,44,52,0.5); display:flex; align-items:center; justify-content:center;
    transform:scale(0.82); transition:transform .5s cubic-bezier(.16,.84,.32,1);}
  .dframe:hover .dplay i{transform:scale(1);}
  .dplay i::after{content:''; display:block; width:0; height:0; margin-left:5px;
    border-left:17px solid #23252b; border-top:10px solid transparent; border-bottom:10px solid transparent;}
  .project-video{display:block; width:100%; height:100%; object-fit:contain; background:#111;}

  /* ============ 项目 CONTENT SECTIONS ============ */
  .section-tabs{position:sticky; top:18px; z-index:20; display:grid; grid-template-columns:repeat(4,1fr);
    gap:8px; margin:clamp(22px,3.5vh,42px) 0 clamp(44px,7vh,84px); padding:8px; border-radius:18px;
    background:rgba(255,255,255,.62); border:1px solid rgba(255,255,255,.76);
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
    box-shadow:0 22px 54px -40px rgba(40,44,52,.62), inset 0 1px 0 rgba(255,255,255,.8);}
  .section-tabs button{display:flex; align-items:center; justify-content:center; min-height:44px; padding:10px 12px;
    border:0; border-radius:12px; background:transparent; color:var(--soft); cursor:pointer;
    font:inherit; font-size:clamp(10px,.9vw,12px); font-weight:600; letter-spacing:.18em;
    transition:background .35s ease,color .35s ease,transform .35s ease,box-shadow .35s ease;}
  .section-tabs button:hover,.section-tabs button:focus-visible{background:rgba(255,255,255,.68); color:var(--ink); transform:translateY(-1px);}
  .section-tabs button.active{background:rgba(255,255,255,.92); color:var(--ink);
    box-shadow:0 12px 28px -22px rgba(40,44,52,.7),inset 0 0 0 1px rgba(183,155,240,.3);}

  .content-section{padding:0 0 clamp(58px,9vh,108px);}
  .content-section[hidden]{display:none !important;}
  .content-section.active{display:block; animation:panelIn .55s cubic-bezier(.16,.84,.32,1) both;}
  @keyframes panelIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .section-head{display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
    padding-bottom:18px; margin-bottom:clamp(20px,3.4vh,38px); border-bottom:1px solid var(--line);}
  .section-id{display:flex; align-items:baseline; gap:14px;}
  .section-no{font-size:clamp(28px,4.5vw,58px); font-weight:800; letter-spacing:-.04em; line-height:.85;}
  .section-name{font-size:clamp(20px,2.5vw,32px); font-weight:750; letter-spacing:.01em;}
  .section-en{font-size:10px; letter-spacing:.3em; color:var(--sub); text-align:right;}
  .section-note{max-width:60ch; margin:-18px 0 clamp(22px,3.6vh,40px); color:var(--soft);
    font-size:clamp(11px,.95vw,13px); line-height:1.8;}

  .turn-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(14px,2vw,26px);}
  .turn-grid.single{grid-template-columns:1fr;}
  .turn-card,.visual-card{position:relative; overflow:hidden; border-radius:20px;
    background:rgba(255,255,255,.44); border:1px solid rgba(255,255,255,.68);
    box-shadow:0 24px 54px -42px rgba(40,44,52,.6), inset 0 1px 0 rgba(255,255,255,.72);}
  .turn-stage{position:relative; aspect-ratio:3/4; overflow:hidden; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(155deg,rgba(255,255,255,.58),rgba(183,155,240,.18) 48%,rgba(143,208,210,.22));}
  .turn-stage::before{content:""; position:absolute; inset:9%; border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.88),rgba(255,255,255,0) 67%); filter:blur(7px);}
  .turn-stage::after{content:""; position:absolute; left:14%; right:14%; bottom:9%; height:1px; background:rgba(40,44,52,.16);}
  .character-sheet{display:block; width:100%; height:auto; background:#fff;}
  .figure{position:relative; width:42%; height:62%; filter:drop-shadow(0 22px 24px rgba(60,58,80,.18));}
  .figure .head{position:absolute; left:32%; top:0; width:36%; aspect-ratio:1; border-radius:50%;
    background:linear-gradient(145deg,#8e86a3,#605d70);}
  .figure .body{position:absolute; left:20%; top:18%; width:60%; height:62%; border-radius:46% 46% 22% 22%;
    background:linear-gradient(155deg,#777086,#454552); clip-path:polygon(18% 0,82% 0,100% 42%,72% 48%,68% 100%,32% 100%,28% 48%,0 42%);}
  .figure .legs{position:absolute; left:31%; bottom:0; width:38%; height:31%;
    background:#4d4c58; clip-path:polygon(0 0,46% 0,47% 100%,24% 100%,22% 30%,0 100%,0 100%,0 0,100% 0,100% 100%,76% 100%,54% 30%,54% 0);}
  .figure.profile{width:32%; transform:translateX(4%);}
  .figure.profile .head{left:36%; width:42%; border-radius:46% 55% 48% 50%;}
  .figure.profile .body{left:28%; width:50%; clip-path:polygon(24% 0,76% 0,100% 45%,72% 52%,70% 100%,28% 100%,25% 45%,0 46%);}
  .figure.back .head,.figure.back .body{background:linear-gradient(215deg,#777184,#4b4958);}
  .card-caption{display:flex; justify-content:space-between; gap:16px; padding:15px 17px 17px; align-items:baseline;}
  .card-caption strong{font-size:clamp(13px,1.2vw,16px); letter-spacing:.06em;}
  .card-caption span{font-size:9px; color:var(--sub); letter-spacing:.22em; text-transform:uppercase;}

  .scene-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:clamp(16px,2.2vw,30px);}
  .scene-grid.single,.asset-grid.single{grid-template-columns:1fr;}
  .scene-img{aspect-ratio:16/10; background-size:cover; background-position:center;
    transition:transform .9s cubic-bezier(.16,.84,.32,1);}
  img.scene-img{display:block; width:100%; height:auto; aspect-ratio:auto; object-fit:contain;}
  .visual-card:hover .scene-img,.visual-card:hover .asset-img{transform:scale(1.045);}
  .asset-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(12px,1.6vw,22px);}
  .asset-img{aspect-ratio:1; background-size:cover; background-position:center;
    transition:transform .9s cubic-bezier(.16,.84,.32,1);}
  img.asset-img{display:block; width:100%; height:auto; aspect-ratio:auto; object-fit:contain;}
  .asset-grid .card-caption{display:block; padding:13px 14px 15px;}
  .asset-grid .card-caption span{display:block; margin-top:5px;}

  .pagenav{display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap;
    padding:clamp(40px,7vh,88px) 0 clamp(18px,4vh,46px); border-top:1px solid var(--line); margin-top:clamp(28px,5vh,60px);}
  .pn-back{display:flex; flex-direction:column; gap:9px; text-decoration:none; color:var(--ink);
    transition:transform .6s cubic-bezier(.16,.84,.32,1);}
  .pn-back:hover{transform:translateX(-6px);}
  .pn-next{display:flex; flex-direction:column; align-items:flex-end; gap:9px; text-decoration:none; color:var(--ink);
    text-align:right; transition:transform .6s cubic-bezier(.16,.84,.32,1);}
  .pn-next:hover{transform:translateX(6px);}
  .pn-lbl{font-size:clamp(10px,.85vw,12px); letter-spacing:.34em; color:var(--sub);}
  .pn-name{font-size:clamp(18px,2.4vw,30px); font-weight:800; letter-spacing:-.01em; line-height:1;}

  footer{padding:clamp(28px,5vh,56px) 0 clamp(34px,6vh,70px); display:flex; justify-content:space-between;
    align-items:center; flex-wrap:wrap; gap:14px; color:var(--sub); font-size:11px; letter-spacing:.22em;}
  footer a{color:var(--sub); text-decoration:none;} footer a:hover{color:var(--ink);}

  .fade{opacity:0; transition:opacity 1.15s ease;}
  .up{opacity:0; transform:translateY(28px); transition:opacity 1.05s ease, transform 1.05s cubic-bezier(.16,.84,.32,1);}
  .ready .fade{opacity:1;} .ready .up{opacity:1; transform:none;}
  .reveal{opacity:0; transform:translateY(36px);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.16,.84,.32,1);}
  .reveal.in{opacity:1; transform:none;}

  @media (max-width:760px){
    .section-tabs{top:10px;}
    .section-tabs button{letter-spacing:.08em; padding:9px 5px;}
    .turn-grid{grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px;}
    .card-caption{padding:11px 10px 13px; flex-direction:column; gap:4px;}
    .card-caption span{letter-spacing:.12em;}
    .scene-grid{grid-template-columns:1fr;}
    .asset-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:480px){
    .section-head{align-items:flex-start;}
    .section-en{max-width:10ch; line-height:1.6;}
    .turn-stage{aspect-ratio:2/3;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;}
    html{scroll-behavior:auto;}
    .fade,.up,.reveal{transition:opacity .5s ease !important; transform:none !important;}
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="glow g1"><div class="blob b1"></div></div>
    <div class="glow g2"><div class="blob b2"></div></div>
    <div class="glow g3"><div class="blob b3"></div></div>
  </div>
  <div class="cursorlight" id="clight" aria-hidden="true"></div>

  <header>
    <div class="brand fade">
      <span class="cn">谷建霏</span>
      <span class="en">AIGC 视觉设计师</span>
      <span class="role">个人作品集</span>
    </div>

      <a href="design.html">设计</a>

      <a href="app.html">应用</a>

  <main class="wrap">
    <a class="back up" href="video.html">&larr; 返回视频</a>

    <section class="detail">
      <div class="dcat up" id="dcat"></div>

      <section class="content-section" id="character" role="tabpanel" hidden>

      <section class="content-section" id="scene" role="tabpanel" hidden>

  <script src="data.js?v=20261012-2"></script>
  <script>
  (function(){
    var PF = window.PF;
    if(!PF || !PF.videos) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var id = parseInt(PF.param('v') || '1', 10);
    var v = PF.findVideo(id);
    var cat = PF.findVideoCat(v.cat);

    document.getElementById('dcat').textContent = cat.num + ' · ' + cat.name + ' / ' + cat.en;
    document.getElementById('dtitle').textContent = v.title;
    document.getElementById('dmeta').innerHTML = '<span>' + v.year + '</span><span>' + v.type + '</span>';
    document.getElementById('ddesc').textContent = v.desc || '';

    var filmMedia = document.getElementById('filmMedia');
    var turnGrid = document.getElementById('turnGrid');
    var sceneGrid = document.getElementById('sceneGrid');
    var assetGrid = document.getElementById('assetGrid');

    if(v.id === 1){
      filmMedia.innerHTML = '<video class="project-video" controls preload="metadata" playsinline poster="assets/video/video-01/scene-01.jpg">' +
        '<source src="assets/video/video-01/video-01.mp4" type="video/mp4">您的浏览器不支持视频播放。</video>';

      turnGrid.classList.add('single');
      turnGrid.innerHTML = '<article class="turn-card"><img class="character-sheet" src="assets/video/video-01/character.png" alt="女主角正面、侧面和背面三视图">' +
        '<div class="card-caption"><strong>女主角三视图</strong><span>推定版</span></div></article>';

      turnGrid.innerHTML += '<article class="turn-card"><img class="character-sheet" src="assets/video/video-01/character-reference.jpg" alt="女主原片造型参考"><div class="card-caption"><strong>女主造型参考</strong><span>原片造型</span></div></article>';

      var realScenes = [
        { src:'assets/video/video-01/scene-01.jpg', name:'热带庭院桌面', no:'场景 01' },
        { src:'assets/video/video-01/scene-02.jpg', name:'橘园与茶园', no:'场景 02' }
      ];
      sceneGrid.innerHTML = realScenes.map(function(item){
        return '<article class="visual-card"><img class="scene-img" src="' + item.src + '" alt="' + item.name + '">' +
          '<div class="card-caption"><strong>' + item.name + '</strong><span>' + item.no + '</span></div></article>';
      }).join('');

      var realAssets = [
        { src:'assets/video/video-01/asset-01.jpg', name:'青橘罐装产品' },
        { src:'assets/video/video-01/asset-02.jpg', name:'青橘气泡酒' },
        { src:'assets/video/video-01/asset-03.jpg', name:'青橘果实' },
        { src:'assets/video/video-01/asset-04.jpg', name:'青橘茶汤' }
      ];
      assetGrid.innerHTML = realAssets.map(function(item, i){
        return '<article class="visual-card"><img class="asset-img" src="' + item.src + '" alt="' + item.name + '">' +
          '<div class="card-caption"><strong>' + item.name + '</strong><span>ASSET 0' + (i + 1) + '</span></div></article>';
      }).join('');

      }).join('');
    }

    /* content tabs: replace the panel in place, without scrolling down the page */
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.section-tabs [role="tab"]'));
    var panels = Array.prototype.slice.call(document.querySelectorAll('.content-section[role="tabpanel"]'));
    function showPanel(id, focusTab){
      tabs.forEach(function(tab){
        var active = tab.dataset.panel === id;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
        tab.tabIndex = active ? 0 : -1;
        if(active && focusTab) tab.focus();
      });
      panels.forEach(function(panel){
        var active = panel.id === id;
        panel.hidden = !active;
        panel.classList.toggle('active', active);
        if(active){
          panel.querySelectorAll('.reveal').forEach(function(el){ el.classList.add('in'); });
        }
      });
    }
    tabs.forEach(function(tab, index){
      tab.addEventListener('click', function(){ showPanel(tab.dataset.panel, false); });
      tab.addEventListener('keydown', function(e){
        if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        e.preventDefault();
        var step = e.key === 'ArrowRight' ? 1 : -1;
        var nextIndex = (index + step + tabs.length) % tabs.length;
        showPanel(tabs[nextIndex].dataset.panel, true);
      });
    });

    /* prev / next wrap around the full 16-clip list */
    var total = PF.videos.length;
    var prevId = v.id === 1 ? total : v.id - 1;
    var nextId = v.id === total ? 1 : v.id + 1;
    var prev = PF.findVideo(prevId), next = PF.findVideo(nextId);
    document.getElementById('prev').href = 'video-detail.html?v=' + prev.id;
    document.getElementById('next').href = 'video-detail.html?v=' + next.id;
    document.getElementById('prevName').textContent = '← ' + prev.title;
    document.getElementById('nextName').textContent = next.title + ' →';

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ document.body.classList.add('ready'); });
    });
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold:0.14 });
    document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });

    if(!reduce){
      var blobs = [document.querySelector('.b1'), document.querySelector('.b2'), document.querySelector('.b3')];
      var clight = document.getElementById('clight');
      var lx = window.innerWidth / 2, ly = window.innerHeight / 2, ticking = false;
      clight.style.transform = 'translate(' + lx + 'px,' + ly + 'px)';
      window._cx = lx; window._cy = ly;
      function follow(){
        lx += (window._cx - lx) * 0.09; ly += (window._cy - ly) * 0.09;
        clight.style.transform = 'translate(' + lx + 'px,' + ly + 'px)';
        ticking = false;
      }
      window.addEventListener('mousemove', function(e){
        var mx = e.clientX / window.innerWidth - 0.5, my = e.clientY / window.innerHeight - 0.5;
        window._cx = e.clientX; window._cy = e.clientY;
        clight.style.opacity = '1';
        if(blobs[0]) blobs[0].style.transform = 'translate(' + (mx * 28) + 'px,' + (my * 24) + 'px)';
        if(blobs[1]) blobs[1].style.transform = 'translate(' + (mx * -24) + 'px,' + (my * -20) + 'px)';
        if(blobs[2]) blobs[2].style.transform = 'translate(' + (mx * 15) + 'px,' + (my * -28) + 'px)';
        if(!ticking){ ticking = true; requestAnimationFrame(follow); }
      });
      window.addEventListener('mouseleave', function(){ clight.style.opacity = '0'; });
    }
  })();
