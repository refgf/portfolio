<!DOCTYPE html>
<html lang="zh" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>项目 — 谷建霏 · AIGC 视觉设计师</title>
<style>
  :root{
    --ink:#23252b; --sub:#8a8f99; --line:rgba(40,44,52,.16);
    --lav:#b79bf0; --cyan:#8fd0d2; --warm:#ffdca8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); background:#eef0f3; overflow-x:hidden; -webkit-font-smoothing:antialiased;}

  .bg{position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(120% 110% at 14% 10%, rgba(183,155,240,.30), transparent 56%),
      radial-gradient(120% 110% at 88% 88%, rgba(143,208,210,.26), transparent 56%),
      radial-gradient(90% 90% at 62% 52%, rgba(255,233,200,.24), transparent 62%),
      linear-gradient(165deg,#f5f5f7 0%,#e9ebef 48%,#f1f3f5 100%);}
  .glow{position:absolute; will-change:transform;}
  .g1{left:-9vmax;top:-11vmax;animation:driftA 26s ease-in-out infinite;}
  .g2{right:-11vmax;bottom:-13vmax;animation:driftB 32s ease-in-out infinite;}
  .g3{left:56%;top:58%;animation:driftC 29s ease-in-out infinite;}
  @keyframes driftA{0%,100%{transform:translate(0,0);}50%{transform:translate(5vmax,4vmax);}}
  @keyframes driftB{0%,100%{transform:translate(0,0);}50%{transform:translate(-5vmax,-4vmax);}}
  @keyframes driftC{0%,100%{transform:translate(0,0);}50%{transform:translate(-4vmax,3vmax);}}
  .blob{border-radius:50%; filter:blur(70px); opacity:.46; mix-blend-mode:soft-light;
    will-change:transform; transition:transform 1.6s cubic-bezier(.16,.84,.32,1);}
  .b1{width:44vmax;height:44vmax;background:var(--lav);}
  .b2{width:38vmax;height:38vmax;background:var(--cyan);}
  .b3{width:28vmax;height:28vmax;background:var(--warm);}
  .cursorlight{position:fixed; width:520px; height:520px; left:0; top:0; margin:-260px 0 0 -260px;
    border-radius:50%; pointer-events:none; z-index:1; opacity:0;
    background:radial-gradient(circle, rgba(255,255,255,.5), rgba(255,244,225,.2) 45%, transparent 70%);
    filter:blur(28px); transition:opacity .8s ease; will-change:transform;}

  header{position:fixed; top:0; left:0; right:0; z-index:30; display:flex; justify-content:space-between;
    align-items:flex-start; padding:clamp(20px,3.2vw,42px) clamp(22px,4vw,56px);}
  .brand .cn{display:block; font-size:clamp(15px,1.4vw,19px); font-weight:700; letter-spacing:.06em;}
  .brand .en{display:block; margin-top:4px; font-size:clamp(11px,1vw,13px); font-weight:500; letter-spacing:.28em; color:#5c6169;}
  .brand .role{display:block; margin-top:5px; font-size:clamp(9px,.78vw,10.5px); letter-spacing:.34em; color:var(--sub);}
  nav{display:flex; gap:clamp(18px,2.4vw,38px); padding-top:5px;}
  nav a{position:relative; font-size:clamp(11px,.95vw,13px); letter-spacing:.26em; font-weight:400;
    color:var(--ink); text-decoration:none; padding-bottom:6px;}
  nav a::after{content:""; position:absolute; left:0; bottom:0; width:100%; height:1px; background:var(--ink);
    transform:scaleX(0); transform-origin:left; transition:transform .5s cubic-bezier(.16,.84,.32,1);}
  nav a:hover::after{transform:scaleX(1);}
  nav a.active::after{transform:scaleX(1); opacity:.42;}

  .wrap{max-width:1180px; margin:0 auto; padding:0 clamp(22px,4vw,56px); position:relative; z-index:2;}

  /* ---------- hero ---------- */
  .hero{padding:clamp(148px,21vh,215px) 0 clamp(22px,4vh,44px);}
  .crumb{font-size:clamp(9.5px,.82vw,11px); letter-spacing:.28em; color:var(--sub);}
  .crumb a{color:var(--sub); text-decoration:none; transition:color .4s ease;}
  .crumb a:hover{color:var(--ink);}
  .crumb span{margin:0 10px; opacity:.5;}
  .hero h1{margin-top:clamp(14px,2.4vh,26px); font-size:clamp(34px,6vw,84px);
    font-weight:800; letter-spacing:-.02em; line-height:1.02;}
  .hero .catline{margin-top:clamp(10px,1.6vh,18px); font-size:clamp(10.5px,.9vw,12.5px);
    letter-spacing:.3em; color:var(--sub);}

  /* ---------- showcase ---------- */
  .showcase{margin-top:clamp(26px,4.5vh,52px); border-radius:20px; overflow:hidden; aspect-ratio:16/10;
    background:#f6f6f8; background-size:cover; background-position:center;
    box-shadow:0 40px 78px -50px rgba(40,44,52,.6);}

  /* ---------- info ---------- */
  .info{margin-top:clamp(28px,5vh,54px); display:grid;
    grid-template-columns:repeat(3, minmax(0,1fr)); gap:clamp(20px,3vw,46px);}
  .info .k{font-size:10.5px; letter-spacing:.26em; color:var(--sub);}
  .info .v{margin-top:8px; font-size:clamp(13px,1.1vw,16px); color:#3d4149; line-height:1.65;}
  .info .wide{grid-column:1 / -1; max-width:720px;}
  .info .wide .v{font-size:clamp(13.5px,1.15vw,17px); line-height:1.85;}

  /* ---------- process ---------- */
  .process{margin-top:clamp(38px,6vh,76px);}
  .process h4{font-size:clamp(11px,1vw,14px); letter-spacing:.32em; font-weight:600;
    margin-bottom:clamp(18px,3vh,34px);}
  .steps{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:clamp(12px,1.6vw,22px); position:relative;}
  .steps::before{content:""; position:absolute; left:0; right:0; top:26%; height:1px; background:var(--line);}
  .step{position:relative;}
  .step .node{position:absolute; left:-4px; top:26%; margin-top:-4px; width:9px; height:9px; border-radius:50%;
    background:#fff; border:1px solid var(--line);}
  .step .thumb{aspect-ratio:1/1; border-radius:14px; background-size:cover; background-position:center;
    box-shadow:0 16px 34px -26px rgba(40,44,52,.55);
    transition:transform .6s cubic-bezier(.16,.84,.32,1), box-shadow .6s ease;}
  .step:hover .thumb{transform:translateY(-6px); box-shadow:0 26px 44px -26px rgba(40,44,52,.6);}
  .step .sn{margin-top:14px; font-size:10.5px; letter-spacing:.24em; color:var(--sub);}
  .step .st{margin-top:6px; font-size:clamp(12px,1.05vw,15px); font-weight:600; letter-spacing:.04em;}

  /* ---------- pager ---------- */
  .pager{display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap;
    margin-top:clamp(40px,7vh,86px); padding-top:clamp(26px,5vh,50px); border-top:1px solid var(--line);}
  .pager a{display:inline-flex; flex-direction:column; gap:6px; text-decoration:none; color:var(--ink);
    transition:transform .5s cubic-bezier(.16,.84,.32,1);}
  .pager a:hover{transform:translateX(-6px);}
  .pager a.next{text-align:right; align-items:flex-end;}
  .pager a.next:hover{transform:translateX(6px);}
  .pager small{font-size:10px; letter-spacing:.3em; color:var(--sub);}
  .pager .t{font-size:clamp(14px,1.4vw,20px); font-weight:700; letter-spacing:.01em;}
  .pager .spacer{flex:1;}

  footer{margin-top:clamp(30px,5vh,56px); padding-bottom:clamp(34px,6vh,70px); display:flex;
    justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
    color:var(--sub); font-size:11px; letter-spacing:.22em;}
  footer a{color:var(--sub); text-decoration:none;} footer a:hover{color:var(--ink);}

  .fade{opacity:0; transition:opacity 1.15s ease;}
  .up{opacity:0; transform:translateY(28px); transition:opacity 1.05s ease, transform 1.05s cubic-bezier(.16,.84,.32,1);}
  .ready .fade{opacity:1;} .ready .up{opacity:1; transform:none;}
  .d1{transition-delay:.10s;} .d2{transition-delay:.20s;} .d3{transition-delay:.30s;} .d4{transition-delay:.42s;}
  .reveal{opacity:0; transform:translateY(34px);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.16,.84,.32,1);}
  .reveal.in{opacity:1; transform:none;}

  @media (max-width:900px){
    .steps{grid-template-columns:repeat(2, minmax(0,1fr));}
    .steps::before{display:none;}
    .info{grid-template-columns:repeat(2, minmax(0,1fr));}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;}
    html{scroll-behavior:auto;}
    .fade,.up,.reveal{transition:opacity .5s ease !important; transform:none !important;}
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="glow g1"><div class="blob b1"></div></div>
    <div class="glow g2"><div class="blob b2"></div></div>
    <div class="glow g3"><div class="blob b3"></div></div>
  </div>
  <div class="cursorlight" id="clight" aria-hidden="true"></div>

  <header>
    <div class="brand fade">
      <span class="cn">谷建霏</span>
      <span class="en">AIGC 视觉设计师</span>
      <span class="role">个人作品集</span>
    </div>
    <nav class="fade">
      <a href="index.html">首页</a>
      <a href="about.html">关于</a>
      <a href="design.html" class="active">设计</a>
      <a href="video.html">视频</a>
      <a href="app.html">应用</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="crumb up">
        <a href="design.html">设计</a><span>/</span>
        <a id="crumbCat" href="design.html">分类</a><span>/</span>
        <em id="crumbProj" style="font-style:normal;">项目</em>
      </div>
      <h1 class="up d1" id="pTitle">项目</h1>
      <div class="catline up d1" id="pCat">分类</div>
    </section>

    <div class="showcase up d2" id="pShow"></div>

    <div class="info">
      <div class="reveal"><div class="k">分类</div><div class="v" id="iCat">—</div></div>
      <div class="reveal"><div class="k">年份</div><div class="v" id="iYear">—</div></div>
      <div class="reveal"><div class="k">使用工具</div><div class="v" id="iTools">—</div></div>
      <div class="wide reveal"><div class="k">项目描述</div><div class="v" id="iDesc">—</div></div>
    </div>

    <section class="process">
      <h4 class="reveal">制作流程</h4>
      <div class="steps" id="steps"></div>
    </section>

    <div class="pager">
      <a id="prevLink" href="#"><small>← 上一个项目</small><span class="t" id="prevName">—</span></a>
      <a class="next" href="#" id="backLink"><small>全部项目</small><span class="t" id="backName">分类</span></a>
      <a class="next" id="nextLink" href="#"><small>下一个 →</small><span class="t" id="nextName">—</span></a>
    </div>

    <footer>
      <span>© 2026 谷建霏</span>
      <span><a href="mailto:19831553856@163.com">19831553856@163.com</a></span>
      <span>设计作品档案</span>
    </footer>
  </main>

  <script src="data.js"></script>
  <script>
  (function(){
    var PF = window.PF;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var found = PF.findCat(PF.param('cat'));
    var ci = found.index, cat = found.cat;
    var rawId = parseInt(PF.param('id'), 10);
    if(isNaN(rawId)) rawId = 0;
    var p = PF.project(ci, rawId);
    var list = PF.projects(ci);

    document.title = p.title + ' — 谷建霏 · AIGC 视觉设计师';
    document.getElementById('crumbCat').textContent = cat.en;
    document.getElementById('crumbCat').href = 'category.html?cat=' + cat.slug;
    document.getElementById('crumbProj').textContent = '项目 0' + (p.id + 1);
    document.getElementById('pTitle').textContent = p.title;
    document.getElementById('pCat').textContent = cat.en + ' · ' + cat.cn;
    document.getElementById('pShow').style.backgroundImage = 'url(' + PF.cover(p.seed, p.pal) + ')';
    document.getElementById('iCat').textContent = p.cat;
    document.getElementById('iYear').textContent = p.year;
    document.getElementById('iTools').textContent = p.tools;
    document.getElementById('iDesc').textContent = p.desc;

    /* process timeline */
    var stepsEl = document.getElementById('steps');
    PF.steps.forEach(function(name, s){
      var d = document.createElement('div');
      d.className = 'step reveal';
      d.innerHTML = '<div class="node"></div><div class="thumb"></div>' +
        '<div class="sn">STEP 0' + (s + 1) + '</div><div class="st">' + name + '</div>';
      d.querySelector('.thumb').style.backgroundImage =
        'url(' + PF.cover(p.seed * 4 + s + 11, (p.pal + s) % PF.palettes.length) + ')';
      stepsEl.appendChild(d);
    });

    /* prev / next inside this category */
    var prev = list[p.id - 1], next = list[p.id + 1];
    var prevLink = document.getElementById('prevLink');
    var nextLink = document.getElementById('nextLink');
    if(prev){ prevLink.href = 'project.html?cat=' + cat.slug + '&id=' + prev.id;
      document.getElementById('prevName').textContent = prev.title; }
    else { prevLink.href = 'category.html?cat=' + cat.slug;
      document.getElementById('prevName').textContent = '返回 TO ' + cat.en; }
    if(next){ nextLink.href = 'project.html?cat=' + cat.slug + '&id=' + next.id;
      document.getElementById('nextName').textContent = next.title; }
    else { nextLink.href = 'category.html?cat=' + cat.slug;
      document.getElementById('nextName').textContent = '全部 ' + cat.en; }
    var back = document.getElementById('backLink');
    back.href = 'category.html?cat=' + cat.slug;
    document.getElementById('backName').textContent = cat.en;

    /* entrance + reveal */
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ document.body.classList.add('ready'); });
    });
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold:0.12 });
    document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });

    if(!reduce){
      var blobs = [document.querySelector('.b1'), document.querySelector('.b2'), document.querySelector('.b3')];
      var clight = document.getElementById('clight');
      var lx = window.innerWidth / 2, ly = window.innerHeight / 2, ticking = false;
      clight.style.transform = 'translate(' + lx + 'px,' + ly + 'px)';
      window._cx = lx; window._cy = ly;
      function follow(){
        lx += (window._cx - lx) * 0.09; ly += (window._cy - ly) * 0.09;
        clight.style.transform = 'translate(' + lx + 'px,' + ly + 'px)';
        ticking = false;
      }
      window.addEventListener('mousemove', function(e){
        var mx = e.clientX / window.innerWidth - 0.5, my = e.clientY / window.innerHeight - 0.5;
        window._cx = e.clientX; window._cy = e.clientY;
        clight.style.opacity = '1';
        blobs[0].style.transform = 'translate(' + (mx * 28) + 'px,' + (my * 24) + 'px)';
        blobs[1].style.transform = 'translate(' + (mx * -24) + 'px,' + (my * -20) + 'px)';
        blobs[2].style.transform = 'translate(' + (mx * 15) + 'px,' + (my * -28) + 'px)';
        if(!ticking){ ticking = true; requestAnimationFrame(follow); }
      });
      window.addEventListener('mouseleave', function(){ clight.style.opacity = '0'; });
    }
  })();
  </script>

  <script src="transition.js"></script>
</body>
</html>
