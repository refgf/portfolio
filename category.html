<!DOCTYPE html>
<html lang="zh" translate="no">
<head>
<meta charset="UTF-8" />
<meta name="google" content="notranslate" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>分类 — 谷建霏 · AIGC 视觉设计师</title>
<style>
  :root{
    --ink:#23252b; --sub:#8a8f99; --line:rgba(40,44,52,.16);
    --lav:#b79bf0; --cyan:#8fd0d2; --warm:#ffdca8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); background:#eef0f3; overflow-x:hidden; -webkit-font-smoothing:antialiased;}

  /* ---------- background ---------- */
  .bg{position:fixed; inset:0; z-index:0; overflow:hidden;
    background:
      radial-gradient(120% 110% at 14% 10%, rgba(183,155,240,.30), transparent 56%),
      radial-gradient(120% 110% at 88% 88%, rgba(143,208,210,.26), transparent 56%),
      radial-gradient(90% 90% at 62% 52%, rgba(255,233,200,.24), transparent 62%),
      linear-gradient(165deg,#f5f5f7 0%,#e9ebef 48%,#f1f3f5 100%);}
  .glow{position:absolute; will-change:transform;}
  .g1{left:-9vmax;top:-11vmax;animation:driftA 26s ease-in-out infinite;}
  .g2{right:-11vmax;bottom:-13vmax;animation:driftB 32s ease-in-out infinite;}
  .g3{left:56%;top:58%;animation:driftC 29s ease-in-out infinite;}
  @keyframes driftA{0%,100%{transform:translate(0,0);}50%{transform:translate(5vmax,4vmax);}}
  @keyframes driftB{0%,100%{transform:translate(0,0);}50%{transform:translate(-5vmax,-4vmax);}}
  @keyframes driftC{0%,100%{transform:translate(0,0);}50%{transform:translate(-4vmax,3vmax);}}
  .blob{border-radius:50%; filter:blur(70px); opacity:.46; mix-blend-mode:soft-light;
    will-change:transform; transition:transform 1.6s cubic-bezier(.16,.84,.32,1);}
  .b1{width:44vmax;height:44vmax;background:var(--lav);}
  .b2{width:38vmax;height:38vmax;background:var(--cyan);}
  .b3{width:28vmax;height:28vmax;background:var(--warm);}
  .cursorlight{position:fixed; width:520px; height:520px; left:0; top:0; margin:-260px 0 0 -260px;
    border-radius:50%; pointer-events:none; z-index:1; opacity:0;
    background:radial-gradient(circle, rgba(255,255,255,.5), rgba(255,244,225,.2) 45%, transparent 70%);
    filter:blur(28px); transition:opacity .8s ease; will-change:transform;}

  /* ---------- header ---------- */
  header{position:fixed; top:0; left:0; right:0; z-index:30; display:flex; justify-content:space-between;
    align-items:flex-start; padding:clamp(20px,3.2vw,42px) clamp(22px,4vw,56px);}
  .brand .cn{display:block; font-size:clamp(15px,1.4vw,19px); font-weight:700; letter-spacing:.06em;}
  .brand .en{display:block; margin-top:4px; font-size:clamp(11px,1vw,13px); font-weight:500; letter-spacing:.28em; color:#5c6169;}
  .brand .role{display:block; margin-top:5px; font-size:clamp(9px,.78vw,10.5px); letter-spacing:.34em; color:var(--sub);}
  nav{display:flex; gap:clamp(18px,2.4vw,38px); padding-top:5px;}
  nav a{position:relative; font-size:clamp(11px,.95vw,13px); letter-spacing:.26em; font-weight:400;
    color:var(--ink); text-decoration:none; padding-bottom:6px;}
  nav a::after{content:""; position:absolute; left:0; bottom:0; width:100%; height:1px; background:var(--ink);
    transform:scaleX(0); transform-origin:left; transition:transform .5s cubic-bezier(.16,.84,.32,1);}
  nav a:hover::after{transform:scaleX(1);}
  nav a.active::after{transform:scaleX(1); opacity:.42;}

  .wrap{max-width:1280px; margin:0 auto; padding:0 clamp(22px,4vw,56px); position:relative; z-index:2;}

  /* ---------- hero ---------- */
  .hero{padding:clamp(148px,21vh,220px) 0 clamp(26px,4.5vh,54px);}
  .crumb{font-size:clamp(9.5px,.82vw,11px); letter-spacing:.28em; color:var(--sub);}
  .crumb a{color:var(--sub); text-decoration:none; transition:color .4s ease;}
  .crumb a:hover{color:var(--ink);}
  .crumb span{margin:0 10px; opacity:.5;}
  .hero h1{margin-top:clamp(14px,2.4vh,26px); font-size:clamp(40px,7.4vw,104px);
    font-weight:800; letter-spacing:-.02em; line-height:.96;}
  .hero .cn2{margin-top:clamp(10px,1.6vh,18px); font-size:clamp(12px,1.1vw,15px); letter-spacing:.3em; color:#5c6169;}
  .hero .desc{margin-top:clamp(18px,2.8vh,32px); max-width:560px;
    font-size:clamp(13px,1.15vw,17px); line-height:1.8; color:#5a5f68;}
  .count{margin-top:clamp(16px,2.4vh,26px); font-size:clamp(10px,.85vw,12px); letter-spacing:.3em; color:var(--sub);}

  /* ---------- project rows (editorial, strict) ---------- */
  .projects{padding:clamp(18px,3.5vh,44px) 0 clamp(20px,4vh,50px);}
  .sec-head{display:flex; justify-content:space-between; align-items:baseline; gap:20px; flex-wrap:wrap;
    margin-bottom:clamp(24px,4.5vh,54px);}
  .sec-head h2{font-size:clamp(12px,1.05vw,15px); letter-spacing:.32em; font-weight:600;}
  .sec-head span{font-size:clamp(10px,.85vw,12px); letter-spacing:.26em; color:var(--sub);}

  .prow{display:grid; grid-template-columns:1fr 1.15fr; gap:clamp(24px,4vw,64px);
    align-items:center; margin-bottom:clamp(46px,9vh,116px); cursor:pointer; text-decoration:none; color:inherit;}
  .prow.alt .ptext{order:2;} .prow.alt .pimgwrap{order:1;}
  .ptext .idx{font-size:11px; letter-spacing:.26em; color:var(--sub);}
  .ptext h3{margin-top:12px; font-size:clamp(24px,3.4vw,46px); font-weight:700; letter-spacing:-.01em; line-height:1.08;}
  .ptext .meta{margin-top:clamp(14px,2.2vh,22px); display:grid; grid-template-columns:auto 1fr; gap:8px 22px;
    font-size:clamp(11px,.95vw,13.5px); color:#5a5f68;}
  .ptext .meta dt{color:var(--sub); letter-spacing:.18em; font-size:10.5px; padding-top:2px;}
  .ptext .meta dd{color:#3d4149;}
  .ptext .view{margin-top:clamp(18px,2.6vh,28px); display:inline-flex; align-items:center; gap:10px;
    font-size:11px; letter-spacing:.26em; color:var(--sub);
    opacity:.45; transform:translateY(6px); transition:opacity .5s ease, transform .55s cubic-bezier(.16,.84,.32,1);}
  .prow:hover .view{opacity:1; transform:none; color:var(--ink);}
  .view .arw{display:inline-block; transition:transform .5s cubic-bezier(.16,.84,.32,1);}
  .prow:hover .view .arw{transform:translateX(6px);}

  .pimgwrap{position:relative; border-radius:18px; overflow:hidden; aspect-ratio:4/3;
    background:#f6f6f8; box-shadow:0 26px 54px -40px rgba(40,44,52,.5); perspective:1000px;}
  .pimgwrap .par{position:absolute; inset:-5%; will-change:transform;}
  .pimgwrap .img{position:absolute; inset:0; background-size:cover; background-position:center;
    transform:scale(1.03); transition:transform 1.2s cubic-bezier(.16,.84,.32,1);}
  .prow:hover .img{transform:scale(1.10);}
  .pimgwrap .mask{position:absolute; inset:0; background:linear-gradient(180deg,transparent 55%,rgba(20,22,28,.28));}

  /* ---------- footer nav ---------- */
  .pager{display:flex; justify-content:space-between; align-items:center; gap:20px; flex-wrap:wrap;
    padding:clamp(26px,5vh,54px) 0 clamp(30px,6vh,64px); border-top:1px solid var(--line);}
  .pager a{display:inline-flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink);
    font-size:clamp(12px,1.1vw,15px); letter-spacing:.2em;
    transition:transform .5s cubic-bezier(.16,.84,.32,1), opacity .4s ease;}
  .pager a:hover{transform:translateX(-6px);}
  .pager a.next:hover{transform:translateX(6px);}
  .pager small{display:block; font-size:10px; letter-spacing:.3em; color:var(--sub); margin-bottom:6px;}

  footer{padding:clamp(24px,4vh,48px) 0 clamp(34px,6vh,70px); display:flex; justify-content:space-between;
    align-items:center; flex-wrap:wrap; gap:14px; color:var(--sub); font-size:11px; letter-spacing:.22em;}
  footer a{color:var(--sub); text-decoration:none;} footer a:hover{color:var(--ink);}

  /* ---------- animation ---------- */
  .fade{opacity:0; transition:opacity 1.15s ease;}
  .up{opacity:0; transform:translateY(28px); transition:opacity 1.05s ease, transform 1.05s cubic-bezier(.16,.84,.32,1);}
  .ready .fade{opacity:1;} .ready .up{opacity:1; transform:none;}
  .d1{transition-delay:.10s;} .d2{transition-delay:.20s;} .d3{transition-delay:.30s;}
  .reveal{opacity:0; transform:translateY(36px);
    transition:opacity 1.1s ease, transform 1.1s cubic-bezier(.16,.84,.32,1);}
  .reveal.in{opacity:1; transform:none;}

  @media (max-width:760px){
    .prow,.prow.alt{grid-template-columns:1fr;}
    .prow.alt .ptext{order:1;} .prow.alt .pimgwrap{order:2;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;}
    html{scroll-behavior:auto;}
    .fade,.up,.reveal{transition:opacity .5s ease !important; transform:none !important;}
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="glow g1"><div class="blob b1"></div></div>
    <div class="glow g2"><div class="blob b2"></div></div>
    <div class="glow g3"><div class="blob b3"></div></div>
  </div>
  <div class="cursorlight" id="clight" aria-hidden="true"></div>

  <header>
    <div class="brand fade">
      <span class="cn">谷建霏</span>
      <span class="en">AIGC 视觉设计师</span>
      <span class="role">个人作品集</span>
    </div>
    <nav class="fade">
      <a href="index.html">首页</a>
      <a href="about.html">关于</a>
      <a href="design.html" class="active">设计</a>
      <a href="video.html">视频</a>
      <a href="app.html">应用</a>
    </nav>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="crumb up"><a href="design.html">设计</a><span>/</span><em id="crumbCat" style="font-style:normal;">分类</em></div>
      <h1 class="up d1" id="catTitle">分类</h1>
      <div class="cn2 up d1" id="catCn">分类</div>
      <p class="desc up d2" id="catDesc"></p>
      <div class="count up d2" id="catCount">3 个项目</div>
    </section>

    <section class="projects">
      <div class="sec-head reveal">
        <h2>项目</h2>
        <span id="projLabel">—</span>
      </div>
      <div id="plist"></div>
    </section>

    <div class="pager">
      <a href="design.html"><small>全部方向</small>← 返回设计</a>
      <a class="next" id="nextCat" href="design.html"><small>下一个方向</small><span id="nextCatName">—</span> →</a>
    </div>

    <footer>
      <span>© 2026 谷建霏</span>
      <span><a href="mailto:19831553856@163.com">19831553856@163.com</a></span>
      <span>设计作品档案</span>
    </footer>
  </main>

  <script src="data.js"></script>
  <script>
  (function(){
    var PF = window.PF;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var key = PF.param('cat');
    var found = PF.findCat(key);
    var ci = found.index, cat = found.cat;

    document.title = cat.en + ' — 谷建霏 · AIGC 视觉设计师';
    document.getElementById('crumbCat').textContent = cat.en;
    document.getElementById('catTitle').textContent = cat.en;
    document.getElementById('catCn').textContent = cat.cn;
    document.getElementById('catDesc').textContent = cat.desc;
    document.getElementById('projLabel').textContent = cat.en;

    var next = PF.cats[(ci + 1) % PF.cats.length];
    var nextLink = document.getElementById('nextCat');
    nextLink.href = 'category.html?cat=' + next.slug;
    document.getElementById('nextCatName').textContent = next.en;

    /* render the three projects */
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold:0.14 });

    var plist = document.getElementById('plist');
    PF.projects(ci).forEach(function(p, i){
      var row = document.createElement('a');
      row.className = 'prow reveal' + (i % 2 ? ' alt' : '');
      row.href = 'project.html?cat=' + cat.slug + '&id=' + p.id;
      row.setAttribute('data-scroll', (0.05 + i * 0.012).toFixed(3));
      row.innerHTML =
        '<div class="ptext">' +
          '<div class="idx">项目 0' + (i + 1) + '</div>' +
          '<h3>' + p.title + '</h3>' +
          '<dl class="meta">' +
            '<dt>分类</dt><dd>' + p.cat + '</dd>' +
            '<dt>年份</dt><dd>' + p.year + '</dd>' +
            '<dt>使用工具</dt><dd>' + p.tools + '</dd>' +
          '</dl>' +
          '<span class="view">VIEW 项目 <span class="arw">→</span></span>' +
        '</div>' +
        '<div class="pimgwrap"><div class="par"><div class="img"></div></div><div class="mask"></div></div>';
      row.querySelector('.img').style.backgroundImage = 'url(' + PF.cover(p.seed, p.pal) + ')';
      plist.appendChild(row);
      io.observe(row);
    });
    document.getElementById('catCount').textContent = '3 个项目';

    /* entrance */
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ document.body.classList.add('ready'); });
    });
    document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });

    if(!reduce){
      var blobs = [document.querySelector('.b1'), document.querySelector('.b2'), document.querySelector('.b3')];
      var clight = document.getElementById('clight');
      var lx = window.innerWidth / 2, ly = window.innerHeight / 2, ticking = false;
      clight.style.transform = 'translate(' + lx + 'px,' + ly + 'px)';
      window._cx = lx; window._cy = ly;
      function follow(){
        lx += (window._cx - lx) * 0.09; ly += (window._cy - ly) * 0.09;
        clight.style.transform = 'translate(' + lx + 'px,' + ly + 'px)';
        ticking = false;
      }
      window.addEventListener('mousemove', function(e){
        var mx = e.clientX / window.innerWidth - 0.5, my = e.clientY / window.innerHeight - 0.5;
        window._cx = e.clientX; window._cy = e.clientY;
        clight.style.opacity = '1';
        blobs[0].style.transform = 'translate(' + (mx * 28) + 'px,' + (my * 24) + 'px)';
        blobs[1].style.transform = 'translate(' + (mx * -24) + 'px,' + (my * -20) + 'px)';
        blobs[2].style.transform = 'translate(' + (mx * 15) + 'px,' + (my * -28) + 'px)';
        if(!ticking){ ticking = true; requestAnimationFrame(follow); }
      });
      window.addEventListener('mouseleave', function(){ clight.style.opacity = '0'; });

      /* scroll parallax: image drifts slower than text */
      var pending = false;
      function onScroll(){
        var vh = window.innerHeight;
        Array.prototype.slice.call(document.querySelectorAll('.prow')).forEach(function(row){
          var par = row.querySelector('.par'); if(!par) return;
          var r = row.getBoundingClientRect();
          if(r.bottom < -240 || r.top > vh + 240) return;
          var prog = (r.top + r.height / 2 - vh / 2) / vh;
          var d = parseFloat(row.getAttribute('data-scroll')) || 0.05;
          par.style.transform = 'translateY(' + (prog * d * 100) + 'px)';
        });
        pending = false;
      }
      window.addEventListener('scroll', function(){
        if(!pending){ pending = true; requestAnimationFrame(onScroll); }
      }, { passive:true });
      onScroll();
    }
  })();
  </script>

  <script src="transition.js"></script>
</body>
</html>
